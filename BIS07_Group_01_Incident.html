<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIS07 Group 1 Incident dashboard</title>
<style>
/* ===== Base styles ===== */
:root{--ink:#1a1d21;--muted:#4a5260;--line:#c9ced6;--bg:#f6f7f9;--card:#fff;--accent:#1f4fa3;--warn:#8a4b00;--warnbg:#fff4e0;--focus:#c2410c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:5}
@media (max-width:700px){header.top{position:static}}
.printonly{display:none}
header.top h1{font-size:1.15rem;margin:0 0 8px}
.controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.controls fieldset{border:0;margin:0;padding:0;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.controls legend{float:left;margin-right:6px;font-size:.85rem;color:var(--muted);padding:0}
button,select{font:inherit;font-size:.9rem;padding:6px 10px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:6px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:#fff}
button[aria-pressed="true"]::before{content:"\2713 "}
label{font-size:.85rem;color:var(--muted)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
main{max-width:1200px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 16px}
h2{font-size:1.1rem;margin:0 0 10px}
h3{font-size:1rem;margin:12px 0 6px}
.notice{background:var(--warnbg);border:2px solid var(--warn);color:#4a2a00;padding:8px 12px;border-radius:6px;font-weight:600}
.small{font-size:.85rem;color:var(--muted)}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:560px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#eef1f5}
code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:.85em;word-break:break-word}
.tag{display:inline-block;border:1px solid var(--muted);border-radius:4px;padding:0 5px;font-size:.78rem;font-weight:600;white-space:nowrap}
.tag.b{border-style:dashed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.empty{padding:10px;border:1px dashed var(--muted);border-radius:6px;font-weight:600}
/* timeline svg */
.tl-wrap{overflow-x:auto}
.tl-wrap svg{min-width:640px;width:100%;height:auto}
/* architecture */
.arch{display:flex;flex-direction:column;gap:6px}
.layer{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px}
.layer .lname{font-size:.8rem;color:var(--muted);width:150px;flex:none}
@media (max-width:600px){.layer .lname{width:100%}}
.layer button{font-size:.85rem}
.layer button.assumed{border-style:dashed}
.arrow{text-align:center;color:var(--muted);font-size:.85rem}
.detail{border-left:4px solid var(--accent);padding:6px 10px;background:#f1f5fb;margin-top:8px}
/* matrix */
td.sup{font-weight:600}
td.ch{font-style:italic}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:2px}
.inshort{font-size:1.05rem;background:#f1f5fb;border-left:4px solid var(--accent);padding:10px 12px;margin:0 0 12px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card h3{margin:0 0 4px}
.card dt,.gloss dt{font-weight:600;font-size:.85rem;color:var(--muted);margin-top:8px}
.card dd,.gloss dd{margin:0}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 16px;margin:0}
blockquote{margin:0;padding:8px 12px;border-left:4px solid var(--accent);background:#f1f5fb}
/* ===== Print ===== */
@media print{
 header.top{position:static}
 .controls,.noprint,#archdetail,.layer button,.check{display:none!important}
 .printonly{display:block}
 body{background:#fff}
 section{break-inside:avoid;border:0;padding:0 0 10px}
 .scroll,.tl-wrap{overflow:visible}
 table{min-width:0}
}
</style>
</head>
<body>
<header class="top">
  <h1 id="title"></h1>
  <div class="controls">
    <fieldset>
      <legend id="lg-lang"></legend>
      <button type="button" data-lang="lv" aria-pressed="false">LV</button>
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
    </fieldset>
    <fieldset>
      <legend id="lg-ver"></legend>
      <button type="button" data-ver="A" aria-pressed="false" id="btn-a"></button>
      <button type="button" data-ver="AB" aria-pressed="true" id="btn-ab"></button>
    </fieldset>
    <div>
      <label for="sysfilter" id="lb-sys"></label>
      <select id="sysfilter"></select>
    </div>
    <button type="button" id="btn-reset"></button>
    <button type="button" id="btn-print"></button>
  </div>
  <p class="small" id="statenote" style="margin:6px 0 0"></p>
  <p class="small" id="live" role="status" aria-live="polite" style="margin:2px 0 0"></p>
</header>
<main id="main"></main>

/* ===== RENDERING ===== */
function renderTimelineSvg(evs){
  const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
  const start = toMin("08:50"), end = toMin("09:20"), W = 800, L = 40, R = 20;
  const x = s => L + (toMin(s)-start)/(end-start)*(W-L-R);
  const count = {};
  let marks = "";
  evs.forEach((e, i) => {
    const tm = e.set === "A" ? e.evt : e.plot;
    const n = count[tm] = (count[tm]||0)+1;
    const cx = x(tm) + (n-1)*9, cy = 160;          // same-minute records are nudged sideways
    const ly = 150 - (i % 6)*20;                    // stagger labels on 6 levels so they do not overlap
    const shape = e.set === "A"
      ? `<circle cx="${cx}" cy="${cy}" r="6" fill="#1f4fa3"/>`
      : `<rect x="${cx-6}" y="${cy-6}" width="12" height="12" fill="#fff" stroke="#8a4b00" stroke-width="3"/>`;
    marks += `<g><line x1="${cx}" y1="${ly+3}" x2="${cx}" y2="${cy-6}" stroke="#9aa3b0"/>${shape}<text x="${cx}" y="${ly}" text-anchor="middle" font-size="11" fill="#1a1d21" stroke="#fff" stroke-width="4" paint-order="stroke">${esc(e.id)} · ${esc(tm)}${e.set==="B" ? (state.lang==="lv"?" saņ.":" recv") : ""}</text></g>`;
  });
  // marker for the reported 08:55 call (described time, not a log record)
  let call = "";
  if (state.ver === "AB" && (state.sys === "all" || state.sys === "CRM")) {
    const cx = x("08:55");
    call = `<g><line x1="${cx}" y1="34" x2="${cx}" y2="175" stroke="#8a4b00" stroke-dasharray="4 3"/><text x="${cx+4}" y="30" font-size="11" fill="#8a4b00">${esc(state.lang==="lv"?"08:55 ziņotais zvans (G1-B01)":"08:55 reported call (G1-B01)")}</text></g>`;
  }
  let ticks = "";
  for (let m = start; m <= end; m += 5) {
    const lbl = `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
    ticks += `<line x1="${x(lbl)}" y1="175" x2="${x(lbl)}" y2="181" stroke="#1a1d21"/><text x="${x(lbl)}" y="196" text-anchor="middle" font-size="11">${lbl}</text>`;
  }
  const label = state.lang==="lv" ? "Laika līnija 08:50 līdz 09:20 UTC: A ieraksti pēc notikuma laika, B ieraksti pēc saņemšanas laika" : "Timeline 08:50 to 09:20 UTC: A records at event time, B records at receipt time";
  return `<div class="tl-wrap"><svg viewBox="0 0 ${W} 205" role="img" aria-label="${esc(label)}"><line x1="${L}" y1="175" x2="${W-R}" y2="175" stroke="#1a1d21"/>${ticks}${call}${marks}</svg></div>`;
}

function render(){
  const L = state.lang, an = ANALYSIS[state.ver], evs = visibleEvents(), total = EVENTS.filter(e => state.ver==="AB" || e.set==="A").length;
  document.documentElement.lang = L;
  document.title = u("title");
  // header controls
  document.getElementById("title").textContent = u("title");
  document.getElementById("lg-lang").textContent = u("lang");
  document.getElementById("lg-ver").textContent = u("ver");
  document.getElementById("btn-a").textContent = u("aonly");
  document.getElementById("btn-ab").textContent = u("ab");
  document.getElementById("lb-sys").textContent = u("sys");
  document.getElementById("btn-reset").textContent = u("reset");
  document.getElementById("btn-print").textContent = u("print");
  document.getElementById("statenote").textContent = u("state");
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
  document.querySelectorAll("[data-ver]").forEach(b => b.setAttribute("aria-pressed", b.dataset.ver === state.ver));
  const sel = document.getElementById("sysfilter");
  sel.innerHTML = `<option value="all">${esc(u("all"))}</option>` + Object.keys(SYSTEMS).map(k => `<option value="${k}">${esc(t(SYSTEMS[k]))}</option>`).join("");
  sel.value = state.sys;

  const li = arr => `<ul>${arr.map(x => `<li>${esc(t(x))}</li>`).join("")}</ul>`;
  const verName = state.ver === "A" ? u("aonly") : u("ab");
  let h = "";

  // 1
  h += `<section aria-labelledby="h1s"><h2 id="h1s">${esc(u("s1"))}</h2><p class="notice">${esc(u("notice"))}</p>
   <p><strong>${esc(u("group"))} 1</strong>. ${esc(u("names"))}</p><ul><li>${esc(u("roleA"))}</li><li>${esc(u("roleB"))}</li></ul><p>${esc(u("caseTxt"))}</p><h3>${esc(u("glossT"))}</h3><dl class="gloss">${GLOSS.filter(g => state.ver==="AB" || !g.b).map(g => `<div><dt>${esc(t(g.w))}</dt><dd>${esc(t(g.d))}</dd></div>`).join("")}</dl></section>`;

  // 2
  h += `<section aria-labelledby="h2s"><h2 id="h2s">${esc(u("s2"))}</h2><p><span class="tag">${esc(u("viewing"))} ${esc(verName)}</span></p>
   <div class="inshort"><strong>${esc(u("inshortT"))}:</strong> ${esc(u(state.ver==="A"?"inshortA":"inshortAB"))}</div>
   <div class="grid2"><div><h3>${esc(u("confirmed"))}</h3>${li(an.confirmed)}</div><div><h3>${esc(u("hyps"))}</h3>${li(an.hyp)}<h3>${esc(u("unknowns"))}</h3>${li(an.unknown)}</div></div>
   <p class="small">${esc(u("h3"))}</p>
   <h3>${esc(u("status"))}</h3><p>${esc(t(an.status))}</p><p class="small">${esc(u(state.ver==="A"?"distinctA":"distinct"))}</p>
   ${an.revision ? `<h3>${esc(u("revision"))}</h3><p>${esc(t(an.revision))}</p>` : ""}</section>`;

  // 3
  const tlRows = evs.map(e => `<tr><td>${e.recv ? esc(e.recv) : esc(t(NS))}</td><td>${typeof e.evt === "string" ? esc(e.evt) : e.evt ? esc(t(e.evt)) : esc(t(NS))}</td><td><span class="tag ${e.set==="B"?"b":""}">${esc(e.set)}</span> <strong>${esc(e.id)}</strong></td><td>${esc(state.lang==="lv" && SRC_LV[e.src] ? SRC_LV[e.src] : e.src)}</td><td>${esc(t(e))}</td><td class="mono">${e.raw ? esc(e.raw) : "-"}</td></tr>`);
  h += `<section aria-labelledby="h3s"><h2 id="h3s">${esc(u("s3"))}</h2><p class="small">${esc(u(state.ver==="A"?"tlNoteA":"tlNote"))}</p><p class="small">${esc(u(state.ver==="A"?"legendA":"legend"))}</p>
   ${renderTimelineSvg(evs)}
   <p class="small"><strong>${esc(u("showing").replace("{n}", evs.length).replace("{t}", total))}</strong></p>
   ${evs.length ? table([u("thRecv"),u("thEvt"),u("thId"),u("thSrc"),u("thWhat"),u("thRaw")], tlRows, u("s3")) : `<p class="empty" role="status">${esc(u("empty"))}</p>`}</section>`;

  // 4
  const archHtml = ARCH.map((ly,i) => `${i ? `<div class="arrow" aria-hidden="true">&#8595;</div>` : ""}<div class="layer"><span class="lname">${esc(t(ly.layer))}</span>${ly.items.filter(it => state.ver==="AB" || !it.onlyB).map(it => `<button type="button" class="${it.assumed?"assumed":""}" data-arch="${it.k}" aria-pressed="${state.arch===it.k}" aria-controls="archdetail">${esc(t(it.name))}</button>`).join("")}</div>`).join("");
  h += `<section aria-labelledby="h4s"><h2 id="h4s">${esc(u("s4"))}</h2><p class="small">${esc(u("archNote"))}</p><div class="arch">${archHtml}</div><div id="archdetail" class="detail" aria-live="polite">${archDetail()}</div><ul class="printonly">${ARCH.flatMap(l=>l.items).filter(it => state.ver==="AB" || !it.onlyB).map(it => `<li><strong>${esc(t(it.name))}</strong>: ${esc(t(it.role))} ${esc(t(it.auth))} (${esc(t(evOf(it)))})</li>`).join("")}</ul></section>`;

  // 5
  h += `<section aria-labelledby="h5s"><h2 id="h5s">${esc(u("s5"))}</h2>${table([u("thItem"),u("thAuth"),u("thCopies"),u("thUnc")], AUTHORITY.filter(a => state.ver==="AB" || !a.onlyB).map(a => `<tr><td>${esc(t(state.ver==="A" && a.itemA ? a.itemA : a.item))}</td><td>${esc(t(a.sys))}</td><td>${esc(t(state.ver==="A" && a.copiesA ? a.copiesA : a.copies))}</td><td>${esc(t(a.unc))}</td></tr>`), u("s5"))}</section>`;

  // 6
  const hypRows = HYP[state.ver].map(x => `<tr><th scope="row">${x.h}</th><td>${esc(t(x.sup))}</td><td>${esc(t(x.con))}</td><td>${esc(t(x.gap))}</td><td>${esc(t(x.conf))}</td></tr>`);
  const mEvs = EVENTS.filter(e => state.ver==="AB" || e.set==="A");
  const cell = v => `<td class="${v==="s"||v==="w"?"sup":v==="c"?"ch":""}">${MLABEL[v].sym} ${esc(t(MLABEL[v]))}</td>`;
  const mRows = mEvs.map(e => `<tr><th scope="row">${esc(e.id)}</th>${cell(MATRIX[e.id][0])}${cell(MATRIX[e.id][1])}<td>${MNOTE[e.id] ? esc(t(MNOTE[e.id])) : ""}</td></tr>`);
  h += `<section aria-labelledby="h6s"><h2 id="h6s">${esc(u("s6"))}</h2><p><span class="tag">${esc(u("viewing"))} ${esc(verName)}</span></p>
   ${table([u("thHyp"),u("thSup"),u("thCon"),u("thGap"),u("thConf")], hypRows, u("s6"))}
   <h3>${esc(u("matrix"))}</h3><p class="small">${esc(u("matrixNote"))}</p>${table([u("thId"),"H1","H2",u("thNote")], mRows, u("matrix"))}</section>`;

  // 7 to 9 and 11: response design was made after Incident B, so version A shows the A checkpoint instead
  if (state.ver === "A") {
    h += `<section aria-labelledby="h7s"><h2 id="h7s">${esc(u("s7"))} / ${esc(u("s8"))} / ${esc(u("s9"))} / ${esc(u("s11"))}</h2><p>${esc(u("respA"))}</p></section>`;
  } else {
  h += `<section aria-labelledby="h7s"><h2 id="h7s">${esc(u("s7"))}</h2><p class="small">${esc(u("decNote"))}</p>${cards(DECISIONS.map(d => ({title:`${d.id} · ${esc(t(d.act))}`, rows:[[u("thWhy"),d.why],[u("thOwn"),t(d.own)],[u("thEvd"),t(d.evd)],[u("thRel"),t(d.rel)]]})))}</section>`;

  // 8
  h += `<section aria-labelledby="h8s"><h2 id="h8s">${esc(u("s8"))}</h2><p class="small">${esc(u("recNote"))}</p>${cards(RECOVERY.map(x => ({title:`${x.id} · ${esc(t(x.crit))}`, rows:[[u("thTest"),t(x.test)],[u("thEv"),t(x.ev)],[u("thWho"),t(x.who)],[u("thFail"),t(x.fail)]]})))}
   <h3>${esc(u("simTitle"))}</h3><p class="small">${esc(u("simNote"))}</p>
   ${RECOVERY.map(r => `<div class="check"><input type="checkbox" id="sim-${r.id}" data-sim="${r.id}" ${state.ticks.has(r.id)?"checked":""}><label for="sim-${r.id}" style="color:inherit;font-size:.95rem">${r.id}: ${esc(t(r.crit))}</label></div>`).join("")}
   <p class="small" id="simcount" role="status">${esc(u("simTicked").replace("{n}", state.ticks.size))}</p></section>`;

  // 9
  h += `<section aria-labelledby="h9s"><h2 id="h9s">${esc(u("s9"))}</h2><blockquote>${esc(t(MESSAGE))}</blockquote><p class="small">${esc(u("msgNote"))}</p></section>`;

  }
  // 10
  h += `<section aria-labelledby="h10s"><h2 id="h10s">${esc(u("s10"))}</h2><p class="small">${esc(u("linkNote"))}</p>${table([u("thRef"),u("thTitle"),u("thVenue"),u("thDepth"),u("thLim")], PAPERS.map(p => `<tr><td>${esc(p.ref)}</td><td><a href="${p.url}" target="_blank" rel="noopener noreferrer">${esc(p.title)}</a></td><td>${esc(p.venue)}</td><td>${esc(t(p.depth))}</td><td>${esc(t(p.lim))}</td></tr>`), u("s10"))}</section>`;

  // 11 (A+B only)
  if (state.ver === "AB") {
  h += `<section aria-labelledby="h11s"><h2 id="h11s">${esc(u("s11"))}</h2><p class="small">${esc(u("chainNote"))}</p>${cards(CHAINS.map(c => ({title:esc(c.src), rows:[[u("thFind"),t(c.find)],[u("thInterp"),t(c.interp)],[u("thDec"),t(c.dec)],[u("thLim"),t(c.lim)]]})))}</section>`;

  }
  // 12
  h += `<section aria-labelledby="h12s"><h2 id="h12s">${esc(u("s12"))}</h2><p>${esc(u("zotero"))}</p></section>`;

  // 13
  h += `<section aria-labelledby="h13s"><h2 id="h13s">${esc(u("s13"))}</h2><p class="small">${esc(u("reviewNote"))}</p>${table([u("thRid"),u("thRsrc"),u("thIssue"),u("thRdec"),u("thReason"),u("thRetest")], REVIEW.map(r => `<tr><td>${esc(r.id)}</td><td>${esc(t(r.src))}</td><td>${esc(t(r.issue))}</td><td>${esc(t(r.dec))}</td><td>${esc(t(r.reason))}</td><td>${esc(t(r.retest))}</td></tr>`), u("s13"))}</section>`;

  document.getElementById("main").innerHTML = h;
}

function archDetail(){
  if (!state.arch) return esc(u("archPick"));
  const it = ARCH.flatMap(l => l.items).find(i => i.k === state.arch);
  return `<strong>${esc(t(it.name))}</strong><br>${esc(u("role"))}: ${esc(t(it.role))}<br>${esc(u("authority"))}: ${esc(t(it.auth))}<br>${esc(u("evidence"))}: ${esc(t(evOf(it)))}`;
}
function evOf(it){ return state.ver === "A" && it.evA ? it.evA : it.ev; }

/* ===== EVENTS / REVIEW LOGIC ===== */
document.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.lang) { state.lang = b.dataset.lang; render(); announce(""); }
  else if (b.dataset.ver) { state.ver = b.dataset.ver; if (state.ver==="A" && ["call","core"].includes(state.arch)) state.arch = null; render(); announce(`${u("viewing")} ${state.ver==="A"?u("aonly"):u("ab")}`); }
  else if (b.dataset.arch) {
    state.arch = b.dataset.arch;
    document.querySelectorAll("[data-arch]").forEach(x => x.setAttribute("aria-pressed", x.dataset.arch === state.arch));
    document.getElementById("archdetail").innerHTML = archDetail();
  }
  else if (b.id === "btn-reset") {
    state.sys = "all"; state.ticks.clear(); state.arch = null; state.ver = "AB";
    render(); announce(u("resetDone"));
  }
  else if (b.id === "btn-print") { window.print(); }
});
document.getElementById("sysfilter").addEventListener("change", e => {
  state.sys = e.target.value; render();
  announce(u("showing").replace("{n}", visibleEvents().length).replace("{t}", EVENTS.filter(x => state.ver==="AB" || x.set==="A").length));
});
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.sim;
  if (!id) return;
  e.target.checked ? state.ticks.add(id) : state.ticks.delete(id);
  document.getElementById("simcount").textContent = u("simTicked").replace("{n}", state.ticks.size);
});
function announce(msg){ document.getElementById("live").textContent = msg; }

render();
</script>
</body>
</html>
